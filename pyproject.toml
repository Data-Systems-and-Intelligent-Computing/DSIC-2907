[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsic-2907-demand-aware-async-fl-nids"
version = "0.1.0"
description = "Demand-aware adaptive participation and update budgeting for asynchronous FL-NIDS"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "torch>=2.6,<3",
  "pyyaml>=6.0,<7",
  "joblib>=1.4,<2",
  "matplotlib>=3.8",
  "scipy>=1.12",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1,<2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
